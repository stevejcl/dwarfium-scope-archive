name: Build Dwarfium Scope Archive

on:
  push:
    branches:
      - evolution
      - evolution-test
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v5

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install base requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install Windows-specific requirements
        if: runner.os == 'Windows'
        run: |
          pip install -r requirements-windows.txt

      - name: ⚙️ Run build script
        run: |
          python buildDwarfiumScopeArchive.py

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zip-${{ github.ref_name }}-${{ runner.os }}
          path: DwarfiumScopeArchive-${{ runner.os }}.zip


  release:
    name: 🚀 Create Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'  # pas de release en manual debug

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v5

      - name: 🏷️ Get base version from CHANGELOG.md
        id: version
        run: |
          VERSION=$(grep -m 1 -o '\[.*\]' CHANGELOG.md | sed 's/\[\(.*\)\]/\1/')
          echo "BASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 🧪 Compute final version (beta or stable)
        run: |
          VERSION=${{ env.BASE_VERSION }}

          if [ "${{ github.ref_name }}" = "evolution-test" ]; then
            RUN=${{ github.run_number }}
            VERSION="${VERSION}-beta.${RUN}"
          fi

          echo "FINAL_VERSION=$VERSION" >> $GITHUB_ENV

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: 🚀 Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: downloads/**/*.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          skipIfReleaseExists: true
          tag: v${{ env.FINAL_VERSION }}
          name: Release v${{ env.FINAL_VERSION }}